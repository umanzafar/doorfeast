<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>DoorFeast — Application Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F7F3EC; --card:#FFFFFF; --ink:#1B1815; --body:#6E6A62;
    --red:#A61E1E; --red-dark:#7C1616; --green:#2E7D46; --line:#E4DFD2;
  }
  *{box-sizing:border-box;} html,body{margin:0;padding:0;}
  body{font-family:'Inter',sans-serif; background:var(--cream); color:var(--ink);}

  /* ============ LOGIN ============ */
  #loginScreen{position:fixed; inset:0; z-index:999; background:var(--ink); display:flex; align-items:center; justify-content:center; padding:24px;}
  .login-card{background:var(--cream); border-radius:20px; padding:40px 34px; max-width:360px; width:100%; text-align:center; box-shadow:0 30px 60px -20px rgba(0,0,0,0.5);}
  .login-card h2{font-family:'Poppins',sans-serif; font-size:19px; margin-bottom:8px;}
  .login-card p{font-size:13px; color:var(--body); margin:0 0 18px;}
  .login-card input{width:100%; border:1.5px solid var(--line); border-radius:10px; padding:12px 14px; font-size:14px; margin-bottom:12px; text-align:left;}
  .login-card input:focus{outline:none; border-color:var(--red); box-shadow:0 0 0 4px rgba(166,30,30,0.12);}
  .login-card button{width:100%; border:none; border-radius:999px; padding:12px; background:var(--red); color:#fff; font-weight:700; font-size:14px; cursor:pointer;}
  .login-card button:hover{background:var(--red-dark);}
  .login-card button:disabled{opacity:0.6; cursor:not-allowed;}
  .login-error{color:var(--red); font-size:12px; margin-top:10px; display:none;}
  .login-error.show{display:block;}
  .not-admin-note{color:var(--body); font-size:12.5px; margin-top:14px; line-height:1.5;}

  /* ============ LAYOUT ============ */
  .topbar{
    background:var(--card); border-bottom:1px solid var(--line);
    padding:16px 28px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px;
  }
  .topbar h1{font-family:'Poppins',sans-serif; font-size:18px; font-weight:800; margin:0; display:flex; align-items:center; gap:10px;}
  .topbar h1 img{width:28px; border-radius:7px;}
  .topbar-actions{display:flex; gap:10px;}
  .refresh-btn, .logout-btn{
    border:1.5px solid var(--line); background:#fff; border-radius:999px; padding:8px 16px;
    font-size:13px; font-weight:600; cursor:pointer; color:var(--ink); display:flex; align-items:center; gap:6px;
  }
  .refresh-btn:hover, .logout-btn:hover{border-color:var(--red); color:var(--red);}
  .refresh-btn.spinning svg{animation:spin 0.8s linear infinite;}
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .tabs{display:flex; gap:8px; padding:20px 28px 0; max-width:1100px; margin:0 auto;}
  .tab{
    border:none; background:none; padding:10px 18px; font-size:14px; font-weight:600;
    color:var(--body); cursor:pointer; border-bottom:2.5px solid transparent; display:flex; align-items:center; gap:8px;
  }
  .tab.active{color:var(--red); border-bottom-color:var(--red);}
  .tab .count{
    background:rgba(38,34,32,0.08); color:var(--ink); font-size:11.5px; font-weight:700;
    padding:2px 8px; border-radius:999px;
  }
  .tab.active .count{background:var(--red); color:#fff;}

  .content{max-width:1100px; margin:0 auto; padding:24px 28px 80px;}
  .app-list{display:flex; flex-direction:column; gap:16px;}
  .empty-state{text-align:center; padding:60px 20px; color:var(--body); font-size:14px;}

  .app-card{
    background:var(--card); border:1px solid var(--line); border-radius:16px; padding:22px 24px;
  }
  .app-card-top{display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex-wrap:wrap; margin-bottom:14px;}
  .app-title{font-family:'Poppins',sans-serif; font-weight:700; font-size:16.5px; margin:0 0 3px;}
  .app-sub{font-size:12.5px; color:var(--body);}
  .status-badge{
    font-size:11.5px; font-weight:700; padding:4px 10px; border-radius:999px; white-space:nowrap;
  }
  .status-approved{background:rgba(46,125,70,0.12); color:var(--green);}
  .status-rejected{background:rgba(166,30,30,0.1); color:var(--red);}
  .status-pending{background:rgba(217,164,65,0.18); color:#8A6414;}

  .app-grid{
    display:grid; grid-template-columns:repeat(auto-fit, minmax(160px, 1fr)); gap:12px 20px;
    font-size:13px; margin-bottom:16px;
  }
  .app-field-label{font-size:11px; text-transform:uppercase; letter-spacing:0.5px; color:var(--body); margin-bottom:2px;}
  .app-field-value{font-weight:600; color:var(--ink); word-break:break-word;}

  .doc-links{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:18px;}
  .doc-link{
    display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600;
    color:var(--red); text-decoration:none; border:1px solid var(--line); border-radius:8px; padding:7px 12px;
    background:none; cursor:pointer; font-family:inherit;
  }
  .doc-link:hover{border-color:var(--red); background:rgba(166,30,30,0.04);}
  .doc-link:disabled{opacity:0.5; cursor:not-allowed;}

  .reject-reason-box{
    background:rgba(166,30,30,0.05); border:1px solid rgba(166,30,30,0.2); border-radius:10px;
    padding:10px 14px; font-size:12.5px; color:var(--ink); margin-bottom:14px;
  }
  .reject-reason-box b{color:var(--red);}

  .action-row{display:flex; gap:10px; flex-wrap:wrap;}
  .btn{
    border:none; border-radius:999px; padding:10px 20px; font-size:13.5px; font-weight:700; cursor:pointer;
  }
  .btn-approve{background:var(--green); color:#fff;}
  .btn-approve:hover{background:#245c37;}
  .btn-reject{background:#fff; color:var(--red); border:1.5px solid var(--red);}
  .btn-reject:hover{background:rgba(166,30,30,0.06);}
  .btn:disabled{opacity:0.6; cursor:not-allowed;}

  .reject-form{
    display:none; margin-top:14px; padding-top:14px; border-top:1px dashed var(--line);
  }
  .reject-form.show{display:block;}
  .reject-form textarea{
    width:100%; min-height:70px; border:1.5px solid var(--line); border-radius:10px; padding:10px 12px;
    font-family:inherit; font-size:13px; resize:vertical; margin-bottom:10px;
  }
  .reject-form textarea:focus{outline:none; border-color:var(--red); box-shadow:0 0 0 4px rgba(166,30,30,0.1);}
  .reject-form-actions{display:flex; gap:10px;}
  .btn-cancel{background:none; color:var(--body); border:1px solid var(--line);}
  .btn-cancel:hover{background:rgba(38,34,32,0.05);}

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--ink); color:#fff; font-size:13.5px; font-weight:600;
    padding:12px 22px; border-radius:999px; opacity:0; pointer-events:none;
    transition:opacity .2s, transform .2s; z-index:200;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  @media (max-width:600px){
    .topbar, .tabs, .content{padding-left:16px; padding-right:16px;}
  }

  /* ============ ADD PARTNER ============ */
  .add-partner-card{
    background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:26px 28px; max-width:520px;
  }
  .form-row{margin-bottom:16px;}
  .form-row label{display:block; font-size:12.5px; font-weight:700; color:var(--body); margin-bottom:6px;}
  .form-row input, .form-row select{
    width:100%; border:1.5px solid var(--line); border-radius:10px; padding:11px 13px;
    font-size:14px; font-family:inherit; color:var(--ink); background:#fff;
  }
  .form-row input:focus, .form-row select:focus{outline:none; border-color:var(--red); box-shadow:0 0 0 4px rgba(166,30,30,0.1);}
  .add-partner-result{
    margin-top:18px; padding:16px 18px; border-radius:12px;
    background:rgba(46,125,70,0.08); border:1px solid rgba(46,125,70,0.25);
    font-size:13px; color:var(--ink); display:none;
  }
  .add-partner-result.show{display:block;}
  .add-partner-result.is-error{background:rgba(166,30,30,0.06); border-color:rgba(166,30,30,0.25);}
  .recovery-link-box{
    display:flex; gap:8px; margin-top:10px; align-items:center;
  }
  .recovery-link-box input{
    flex:1; border:1.5px solid var(--line); border-radius:8px; padding:9px 11px;
    font-size:12px; font-family:monospace; background:#fff; color:var(--ink);
  }
  .copy-link-btn{
    border:1.5px solid var(--line); background:#fff; border-radius:8px; padding:9px 14px;
    font-size:12.5px; font-weight:600; cursor:pointer; white-space:nowrap;
  }
  .copy-link-btn:hover{border-color:var(--red); color:var(--red);}

  /* ============ GO-LIVE CHECKLIST ============ */
  .checklist{
    border-top:1px dashed var(--line); margin-top:14px; padding-top:14px;
    display:grid; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr)); gap:10px 16px;
  }
  .checklist-item{display:flex; align-items:center; gap:8px; font-size:12.5px;}
  .checklist-item.auto{color:var(--body);}
  .checklist-item .ci-dot{
    width:9px; height:9px; border-radius:50%; flex-shrink:0;
    background:rgba(38,34,32,0.15);
  }
  .checklist-item.done .ci-dot{background:var(--green);}
  .checklist-item label{display:flex; align-items:center; gap:8px; cursor:pointer;}
  .checklist-item input[type="checkbox"]{width:15px; height:15px; accent-color:var(--green); cursor:pointer;}
  .checklist-note{font-size:11px; color:var(--body); margin-top:8px; line-height:1.5;}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="loginScreen">
  <div class="login-card">
    <h2>Admin login</h2>
    <p>This page reviews live takeaway applications. Log in with your admin account.</p>
    <input type="email" id="loginEmail" placeholder="Email" autocomplete="email">
    <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password">
    <button id="loginSubmit">Log in</button>
    <p class="login-error" id="loginError"></p>
  </div>
</div>

<!-- ============ TOPBAR ============ -->
<div class="topbar" style="display:none;" id="appShell">
  <h1><img src="logo.png" alt="DoorFeast"> Application Review</h1>
  <div class="topbar-actions">
    <button class="refresh-btn" id="refreshBtn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 4v5h-5"/></svg>
      Refresh
    </button>
    <button class="logout-btn" id="logoutBtn">Log out</button>
  </div>
</div>

<div id="tabsAndContent" style="display:none;">
  <!-- ============ TABS ============ -->
  <div class="tabs">
    <button class="tab active" data-tab="pending">Pending <span class="count" id="countPending">0</span></button>
    <button class="tab" data-tab="approved">Approved <span class="count" id="countApproved">0</span></button>
    <button class="tab" data-tab="rejected">Rejected <span class="count" id="countRejected">0</span></button>
    <button class="tab" data-tab="addpartner">+ Add Partner</button>
    <button class="tab" data-tab="menurequests">Menu Requests <span class="count" id="countMenuRequests">0</span></button>
  </div>

  <!-- ============ CONTENT ============ -->
  <div class="content">
    <div class="app-list" id="appList">
      <div class="empty-state">Loading applications…</div>
    </div>

    <div class="add-partner-card" id="addPartnerCard" style="display:none;">
      <form id="addPartnerForm">
        <div class="form-row">
          <label for="apBusinessName">Shop name</label>
          <input type="text" id="apBusinessName" required>
        </div>
        <div class="form-row">
          <label for="apOwnerName">Owner name</label>
          <input type="text" id="apOwnerName" required>
        </div>
        <div class="form-row">
          <label for="apPhone">Phone</label>
          <input type="text" id="apPhone" placeholder="+44 7700 900123" required>
        </div>
        <div class="form-row">
          <label for="apEmail">Email</label>
          <input type="email" id="apEmail" placeholder="owner@example.com" required>
        </div>
        <div class="form-row">
          <label for="apCuisine">Cuisine</label>
          <select id="apCuisine" required>
            <option value="" disabled selected>Choose one</option>
            <option>Indian</option>
            <option>Chinese</option>
            <option>Pizza</option>
            <option>Kebab</option>
            <option>Desserts</option>
            <option>Fast Food</option>
            <option>Other</option>
          </select>
        </div>
        <div class="form-row">
          <label for="apAddress">Address</label>
          <input type="text" id="apAddress" required>
        </div>
        <button type="submit" class="btn btn-approve" id="addPartnerSubmit">Create partner</button>
      </form>
      <div class="add-partner-result" id="addPartnerResult"></div>
    </div>

    <div class="app-list" id="menuRequestsList" style="display:none;">
      <div class="empty-state">Loading menu requests…</div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

  const SUPABASE_URL = 'https://ooiajowrhwvidyydqhnl.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9vaWFqb3dyaHd2aWR5eWRxaG5sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwNTY0MDAsImV4cCI6MjEwMTYzMjQwMH0.gbPWyPYehj7_-xyJk3SgvkFpAUWLrI-FdFIYX39V_f4';
  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const loginScreen = document.getElementById('loginScreen');
  const appShell = document.getElementById('appShell');
  const tabsAndContent = document.getElementById('tabsAndContent');
  const loginEmail = document.getElementById('loginEmail');
  const loginPassword = document.getElementById('loginPassword');
  const loginError = document.getElementById('loginError');
  const loginSubmit = document.getElementById('loginSubmit');

  function showLoginError(msg){
    loginError.textContent = msg;
    loginError.classList.add('show');
  }

  async function tryLogin(){
    loginError.classList.remove('show');
    loginSubmit.disabled = true;
    loginSubmit.textContent = 'Logging in…';
    try {
      const { error } = await supabase.auth.signInWithPassword({
        email: loginEmail.value.trim(),
        password: loginPassword.value
      });
      if(error) throw error;
      await checkAdminAndEnter();
    } catch(err){
      showLoginError(err.message && err.message.toLowerCase().includes('invalid') ? 'Email or password is incorrect.' : 'Something went wrong — please try again.');
    } finally {
      loginSubmit.disabled = false;
      loginSubmit.textContent = 'Log in';
    }
  }
  loginSubmit.addEventListener('click', tryLogin);
  loginPassword.addEventListener('keydown', (e) => { if(e.key === 'Enter') tryLogin(); });

  // Real protection: even if this client-side check were somehow bypassed,
  // RLS on restaurant_applications only lets rows through to users who are
  // actually rows in the admins table — enforced by Postgres, not this JS.
  async function checkAdminAndEnter(){
    const { data: { session } } = await supabase.auth.getSession();
    if(!session){
      loginScreen.style.display = 'flex';
      return;
    }
    const { data: adminRow } = await supabase
      .from('admins')
      .select('user_id')
      .maybeSingle();

    if(!adminRow){
      showLoginError('This account is not an admin.');
      await supabase.auth.signOut();
      return;
    }

    loginScreen.style.display = 'none';
    appShell.style.display = 'flex';
    tabsAndContent.style.display = 'block';
    loadApplications();
  }

  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await supabase.auth.signOut();
    window.location.reload();
  });

  /* ============ STATE ============ */
  let appData = { pending: [], approved: [], rejected: [] };
  let currentTab = 'pending';

  const appList = document.getElementById('appList');
  const refreshBtn = document.getElementById('refreshBtn');
  const toast = document.getElementById('toast');

  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2600);
  }

  function fmtDate(iso){
    if(!iso) return '—';
    const d = new Date(iso);
    return d.toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' });
  }

  function escapeHtml(str){
    if(!str) return '';
    return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // Documents live in a private bucket — a signed URL is generated on
  // demand (valid 5 minutes), rather than ever storing a public link.
  async function openDocument(path, label){
    if(!path){ showToast(`No ${label} on file.`); return; }
    const { data, error } = await supabase.storage.from('application-documents').createSignedUrl(path, 300);
    if(error || !data){ showToast(`Couldn't open ${label}.`); return; }
    window.open(data.signedUrl, '_blank', 'noopener');
  }
  window.openDocument = openDocument;

  // Cuisine/documents aren't collected until the owner completes
  // onboarding-documents.html post-approval, so a path may not exist yet —
  // render a disabled placeholder instead of a button that would call
  // openDocument with a missing (or, worse, the literal string "null") path.
  function docLinkOrPending(path, label){
    if(!path) return `<button class="doc-link" disabled>${escapeHtml(label)} — not yet uploaded</button>`;
    return `<button class="doc-link" onclick="openDocument('${escapeHtml(path)}', '${escapeHtml(label)}')">${escapeHtml(label)}</button>`;
  }

  /* ============ LOAD & RENDER ============ */
  // Keyed by restaurant_id — go-live checklist data for approved apps
  // (opening hours + the 3 manual flags from restaurants, plus a live
  // menu item count). Only fetched for approved apps since that's the
  // only tab the checklist shows on.
  let restaurantExtras = {};

  async function loadApplications(){
    refreshBtn.classList.add('spinning');
    try {
      const { data, error } = await supabase
        .from('restaurant_applications')
        .select('*')
        .order('created_at', { ascending: false });
      if(error) throw error;

      appData = { pending: [], approved: [], rejected: [] };
      (data || []).forEach(app => {
        if(appData[app.status]) appData[app.status].push(app);
      });

      document.getElementById('countPending').textContent = appData.pending.length;
      document.getElementById('countApproved').textContent = appData.approved.length;
      document.getElementById('countRejected').textContent = appData.rejected.length;

      await loadRestaurantExtras();
      renderTab();
    } catch(err){
      console.error(err);
      appList.innerHTML = '<div class="empty-state">Couldn\'t load applications. Hit Refresh to try again.</div>';
    } finally {
      refreshBtn.classList.remove('spinning');
    }
  }

  async function loadRestaurantExtras(){
    const restaurantIds = appData.approved.map(a => a.restaurant_id).filter(Boolean);
    restaurantExtras = {};
    if(restaurantIds.length === 0) return;

    const [{ data: restaurants }, { data: menuItems }] = await Promise.all([
      supabase.from('restaurants')
        .select('id, opening_hours, checklist_stripe_connected, checklist_device_registered, checklist_test_order_completed')
        .in('id', restaurantIds),
      supabase.from('menu_items').select('restaurant_id').in('restaurant_id', restaurantIds)
    ]);

    (restaurants || []).forEach(r => {
      restaurantExtras[r.id] = { ...r, menuItemCount: 0 };
    });
    (menuItems || []).forEach(item => {
      if(restaurantExtras[item.restaurant_id]) restaurantExtras[item.restaurant_id].menuItemCount++;
    });
  }

  // Go-live checklist: menu/docs/hours are auto-detected from data already
  // loaded; Stripe/device/test-order are manual admin checkboxes since
  // there's no automated way to verify them yet.
  function renderChecklist(restaurantId){
    const extra = restaurantExtras[restaurantId];
    if(!extra) return '';
    const app = appData.approved.find(a => a.restaurant_id === restaurantId);
    const docsComplete = app && app.hygiene_cert_path && app.business_reg_path && app.id_doc_path;
    const hoursSet = extra.opening_hours && Object.keys(extra.opening_hours).length > 0;
    const menuLoaded = extra.menuItemCount > 0;

    function autoItem(label, isDone){
      return `<div class="checklist-item auto ${isDone ? 'done' : ''}"><span class="ci-dot"></span>${label}</div>`;
    }
    function manualItem(label, field, isChecked){
      return `
        <div class="checklist-item ${isChecked ? 'done' : ''}">
          <label>
            <input type="checkbox" ${isChecked ? 'checked' : ''} onchange="handleToggleChecklist('${restaurantId}', '${field}', this.checked)">
            ${label}
          </label>
        </div>`;
    }

    return `
      <div class="checklist">
        ${autoItem('Menu loaded', menuLoaded)}
        ${autoItem('Documents verified', docsComplete)}
        ${autoItem('Hours set', hoursSet)}
        ${manualItem('Stripe connected', 'checklist_stripe_connected', extra.checklist_stripe_connected)}
        ${manualItem('Device registered', 'checklist_device_registered', extra.checklist_device_registered)}
        ${manualItem('Test order completed', 'checklist_test_order_completed', extra.checklist_test_order_completed)}
      </div>
      <p class="checklist-note">Stripe Connect requires a registered business — if this shop doesn't have one yet, confirm payment is handled another way before checking this.</p>
    `;
  }

  window.handleToggleChecklist = async function(restaurantId, field, checked){
    try {
      const { error } = await supabase.from('restaurants').update({ [field]: checked }).eq('id', restaurantId);
      if(error) throw error;
      if(restaurantExtras[restaurantId]) restaurantExtras[restaurantId][field] = checked;
      showToast('Saved.');
    } catch(err){
      console.error(err);
      showToast('Something went wrong — please try again.');
      await loadRestaurantExtras();
      renderTab();
    }
  };

  function renderTab(){
    const list = appData[currentTab] || [];
    if(list.length === 0){
      const label = currentTab === 'pending' ? 'No pending applications right now.'
        : currentTab === 'approved' ? 'No approved takeaways yet.'
        : 'No rejected applications yet.';
      appList.innerHTML = `<div class="empty-state">${label}</div>`;
      return;
    }

    appList.innerHTML = list.map(app => {
      const statusClass = currentTab === 'approved' ? 'status-approved' : currentTab === 'rejected' ? 'status-rejected' : 'status-pending';
      const statusLabel = currentTab === 'approved' ? 'Approved' : currentTab === 'rejected' ? 'Rejected' : 'Pending review';

      return `
      <div class="app-card" data-id="${app.id}">
        <div class="app-card-top">
          <div>
            <p class="app-title">${escapeHtml(app.business_name)}</p>
            <p class="app-sub">Submitted ${fmtDate(app.created_at)}</p>
          </div>
          <span class="status-badge ${statusClass}">${escapeHtml(statusLabel)}</span>
        </div>

        <div class="app-grid">
          <div><div class="app-field-label">Owner</div><div class="app-field-value">${escapeHtml(app.owner_name)}</div></div>
          <div><div class="app-field-label">Phone</div><div class="app-field-value">${escapeHtml(app.phone)}</div></div>
          <div><div class="app-field-label">Email</div><div class="app-field-value">${escapeHtml(app.email)}</div></div>
          <div><div class="app-field-label">Cuisine</div><div class="app-field-value">${app.cuisine ? escapeHtml(app.cuisine) : 'Not yet provided — pending owner setup'}</div></div>
          <div style="grid-column:1/-1;"><div class="app-field-label">Address</div><div class="app-field-value">${escapeHtml(app.address)}</div></div>
        </div>

        <div class="doc-links">
          ${docLinkOrPending(app.hygiene_cert_path, 'Hygiene Certificate')}
          ${docLinkOrPending(app.business_reg_path, 'Business Registration')}
          ${docLinkOrPending(app.id_doc_path, 'ID Document')}
        </div>

        ${currentTab === 'rejected' && app.reject_reason ? `
          <div class="reject-reason-box"><b>Reason sent to applicant:</b> ${escapeHtml(app.reject_reason)}</div>
        ` : ''}

        ${currentTab === 'approved' && app.restaurant_id ? renderChecklist(app.restaurant_id) : ''}

        ${currentTab === 'pending' ? `
          <div class="action-row">
            <button class="btn btn-approve" onclick="handleApprove('${app.id}', this)">Approve</button>
            <button class="btn btn-reject" onclick="toggleRejectForm('${app.id}')">Reject</button>
          </div>
          <div class="reject-form" id="reject-form-${app.id}">
            <textarea id="reject-reason-${app.id}" placeholder="Reason for rejection — this gets emailed to the applicant (e.g. expired certificate, mismatched name, missing document)"></textarea>
            <div class="reject-form-actions">
              <button class="btn btn-reject" id="reject-confirm-${app.id}" disabled onclick="handleReject('${app.id}', this)">Confirm reject</button>
              <button class="btn btn-cancel" onclick="toggleRejectForm('${app.id}')">Cancel</button>
            </div>
          </div>
        ` : ''}
      </div>`;
    }).join('');

    list.forEach(app => {
      const textarea = document.getElementById(`reject-reason-${app.id}`);
      const confirmBtn = document.getElementById(`reject-confirm-${app.id}`);
      if(textarea && confirmBtn){
        textarea.addEventListener('input', () => {
          confirmBtn.disabled = textarea.value.trim().length === 0;
        });
      }
    });
  }

  /* ============ TABS ============ */
  const addPartnerCard = document.getElementById('addPartnerCard');
  const menuRequestsList = document.getElementById('menuRequestsList');

  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      currentTab = tab.dataset.tab;

      appList.style.display = 'none';
      addPartnerCard.style.display = 'none';
      menuRequestsList.style.display = 'none';

      if(currentTab === 'addpartner'){
        addPartnerCard.style.display = 'block';
      } else if(currentTab === 'menurequests'){
        menuRequestsList.style.display = 'flex';
        loadMenuRequests();
      } else {
        appList.style.display = 'flex';
        renderTab();
      }
    });
  });

  /* ============ ADD PARTNER ============
     Real onboarding path for a sales-led signup — calls admin-add-partner,
     which verifies admin status server-side and does everything (creating
     the Auth user, the application, the restaurant) with service_role.
     Nothing here can be spoofed from devtools. */
  const addPartnerForm = document.getElementById('addPartnerForm');
  const addPartnerSubmit = document.getElementById('addPartnerSubmit');
  const addPartnerResult = document.getElementById('addPartnerResult');

  addPartnerForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    addPartnerResult.classList.remove('show', 'is-error');
    addPartnerSubmit.disabled = true;
    addPartnerSubmit.textContent = 'Creating…';

    try {
      const { data, error } = await supabase.functions.invoke('admin-add-partner', {
        body: {
          business_name: document.getElementById('apBusinessName').value.trim(),
          owner_name: document.getElementById('apOwnerName').value.trim(),
          phone: document.getElementById('apPhone').value.trim(),
          email: document.getElementById('apEmail').value.trim(),
          cuisine: document.getElementById('apCuisine').value,
          address: document.getElementById('apAddress').value.trim()
        }
      });
      if(error) throw error;
      if(data && data.error) throw new Error(data.error);

      addPartnerResult.classList.add('show');
      if(data.recovery_link){
        addPartnerResult.innerHTML = `
          <b>Partner created.</b> Send this link so they can set a password and log in:
          <div class="recovery-link-box">
            <input type="text" id="recoveryLinkInput" readonly value="${escapeHtml(data.recovery_link)}">
            <button type="button" class="copy-link-btn" id="copyRecoveryLinkBtn">Copy</button>
          </div>`;
        document.getElementById('copyRecoveryLinkBtn').addEventListener('click', () => {
          const input = document.getElementById('recoveryLinkInput');
          input.select();
          navigator.clipboard.writeText(input.value).then(() => showToast('Link copied.'));
        });
      } else {
        addPartnerResult.textContent = data.warning || 'Partner created.';
      }

      addPartnerForm.reset();
      await loadApplications();
    } catch(err){
      console.error(err);
      addPartnerResult.classList.add('show', 'is-error');
      addPartnerResult.textContent = err.message || 'Something went wrong — please try again.';
    } finally {
      addPartnerSubmit.disabled = false;
      addPartnerSubmit.textContent = 'Create partner';
    }
  });

  /* ============ MENU REQUESTS ============
     The other side of dashboard.html's hybrid menu-building upload — a
     human on the team builds each restaurant's menu from the photos they
     submitted, then marks it done here so the owner's banner updates. */
  let menuRequests = [];

  async function openMenuBuildFile(path, label){
    if(!path){ showToast(`No ${label} on file.`); return; }
    const { data, error } = await supabase.storage.from('menu-build-uploads').createSignedUrl(path, 300);
    if(error || !data){ showToast(`Couldn't open ${label}.`); return; }
    window.open(data.signedUrl, '_blank', 'noopener');
  }
  window.openMenuBuildFile = openMenuBuildFile;

  async function loadMenuRequests(){
    menuRequestsList.innerHTML = '<div class="empty-state">Loading menu requests…</div>';
    try {
      const { data, error } = await supabase
        .from('menu_build_requests')
        .select('*, restaurants(name)')
        .order('created_at', { ascending: false });
      if(error) throw error;
      menuRequests = data || [];
      document.getElementById('countMenuRequests').textContent = menuRequests.filter(r => r.status !== 'done').length;
      renderMenuRequests();
    } catch(err){
      console.error(err);
      menuRequestsList.innerHTML = '<div class="empty-state">Couldn\'t load menu requests. Hit Refresh to try again.</div>';
    }
  }

  function renderMenuRequests(){
    if(menuRequests.length === 0){
      menuRequestsList.innerHTML = '<div class="empty-state">No menu-build requests yet.</div>';
      return;
    }
    menuRequestsList.innerHTML = menuRequests.map(req => `
      <div class="app-card">
        <div class="app-card-top">
          <div>
            <p class="app-title">${escapeHtml(req.restaurants ? req.restaurants.name : 'Unknown restaurant')}</p>
            <p class="app-sub">Submitted ${fmtDate(req.created_at)}</p>
          </div>
          <span class="status-badge ${req.status === 'done' ? 'status-approved' : 'status-pending'}">${escapeHtml(req.status === 'done' ? 'Done' : req.status === 'in_progress' ? 'In progress' : 'Pending')}</span>
        </div>
        ${req.note ? `<div class="reject-reason-box"><b>Note from owner:</b> ${escapeHtml(req.note)}</div>` : ''}
        <div class="doc-links">
          ${(req.file_paths || []).map((path, i) => `<button class="doc-link" onclick="openMenuBuildFile('${escapeHtml(path)}', 'Photo ${i + 1}')">Photo ${i + 1}</button>`).join('')}
        </div>
        ${req.status !== 'done' ? `
          <div class="action-row">
            <button class="btn btn-approve" onclick="handleMarkMenuRequestDone('${req.id}', this)">Mark as done</button>
          </div>
        ` : ''}
      </div>
    `).join('');
  }

  window.handleMarkMenuRequestDone = async function(id, btn){
    btn.disabled = true;
    btn.textContent = 'Saving…';
    try {
      const { error } = await supabase.from('menu_build_requests').update({ status: 'done' }).eq('id', id);
      if(error) throw error;
      showToast('Marked as done.');
      await loadMenuRequests();
    } catch(err){
      console.error(err);
      showToast('Something went wrong — please try again.');
      btn.disabled = false;
      btn.textContent = 'Mark as done';
    }
  };

  refreshBtn.addEventListener('click', () => {
    if(currentTab === 'menurequests') loadMenuRequests();
    else loadApplications();
  });

  /* ============ ACTIONS — both call the decide-application Edge Function,
     which verifies admin status server-side and does the actual writes
     with service_role. Nothing here can be spoofed from devtools. ============ */
  async function sendDecision(id, action, reason){
    const { data, error } = await supabase.functions.invoke('decide-application', {
      body: { application_id: id, action, reject_reason: reason || undefined }
    });
    if(error) throw error;
    if(data && data.error) throw new Error(data.error);
    return data;
  }
  window.sendDecision = sendDecision;

  window.handleApprove = async function(id, btn){
    btn.disabled = true;
    btn.textContent = "Approving…";
    try {
      await sendDecision(id, "approve", "");
      showToast("Approved — restaurant record created (not live yet until its details are filled in).");
      await loadApplications();
    } catch(err){
      console.error(err);
      showToast("Something went wrong — please try again.");
      btn.disabled = false;
      btn.textContent = "Approve";
    }
  };

  window.toggleRejectForm = function(id){
    const form = document.getElementById(`reject-form-${id}`);
    form.classList.toggle('show');
  };

  window.handleReject = async function(id, btn){
    const textarea = document.getElementById(`reject-reason-${id}`);
    const reason = textarea.value.trim();
    if(!reason) return;

    btn.disabled = true;
    btn.textContent = "Rejecting…";
    try {
      await sendDecision(id, "reject", reason);
      showToast("Rejected.");
      await loadApplications();
    } catch(err){
      console.error(err);
      showToast("Something went wrong — please try again.");
      btn.disabled = false;
      btn.textContent = "Confirm reject";
    }
  };

  /* ============ BOOT ============ */
  checkAdminAndEnter();
</script>
</body>
</html>
