<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DoorFeast — Partner Sign Up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F7F3EC; --card:#FFFFFF; --ink:#1B1815; --body:#6E6A62;
    --red:#A61E1E; --red-dark:#7C1616; --line:#E4DFD2;
  }
  *{box-sizing:border-box;} html,body{margin:0;padding:0;}
  body{
    font-family:'Inter',sans-serif; background:var(--cream); color:var(--ink);
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:20px;
    padding:40px 34px; max-width:400px; width:100%;
  }
  .card img{width:40px; border-radius:10px; display:block; margin:0 auto 16px;}
  .card h1{font-family:'Poppins',sans-serif; font-size:21px; text-align:center; margin:0 0 6px;}
  .card p.sub{font-size:13.5px; color:var(--body); text-align:center; margin:0 0 26px;}

  label{font-size:12.5px; font-weight:600; color:var(--body); display:block; margin-bottom:6px;}
  input{
    width:100%; border:1.5px solid var(--line); border-radius:10px; padding:12px 14px;
    font-size:14px; margin-bottom:16px; font-family:inherit;
  }
  input:focus{outline:none; border-color:var(--red); box-shadow:0 0 0 4px rgba(166,30,30,0.12);}

  .btn{
    width:100%; border:none; border-radius:999px; padding:13px; font-weight:700; font-size:14.5px;
    cursor:pointer; margin-bottom:12px;
  }
  .btn-primary{background:var(--red); color:#fff;}
  .btn-primary:hover{background:var(--red-dark);}
  .btn-primary:disabled{opacity:0.6; cursor:not-allowed;}
  .btn-google{
    background:#fff; color:var(--ink); border:1.5px solid var(--line);
    display:flex; align-items:center; justify-content:center; gap:10px;
  }
  .btn-google:hover{border-color:#c9c3b3;}
  .btn-google:disabled{opacity:0.6; cursor:not-allowed;}

  .divider{display:flex; align-items:center; gap:12px; margin:18px 0; color:var(--body); font-size:12.5px;}
  .divider::before, .divider::after{content:""; flex:1; height:1px; background:var(--line);}

  .error-box{
    background:rgba(166,30,30,0.06); border:1px solid rgba(166,30,30,0.25); color:var(--red);
    font-size:12.5px; padding:10px 14px; border-radius:10px; margin-bottom:16px; display:none;
  }
  .error-box.show{display:block;}

  .toggle-mode{text-align:center; font-size:13px; color:var(--body); margin-top:6px;}
  .toggle-mode a{color:var(--red); font-weight:600; text-decoration:none; cursor:pointer;}
  .toggle-mode a:hover{text-decoration:underline;}
</style>
</head>
<body>

<div class="card">
  <img src="logo.png" alt="DoorFeast">
  <h1 id="formTitle">Become a DoorFeast Partner</h1>
  <p class="sub" id="formSub">Create your account to start your takeaway application.</p>

  <div class="error-box" id="errorBox"></div>

  <button class="btn btn-google" id="googleBtn">
    <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.52 12.27c0-.79-.07-1.54-.2-2.27H12v4.3h6.47a5.53 5.53 0 0 1-2.4 3.63v3h3.87c2.27-2.09 3.58-5.17 3.58-8.66z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.94-2.92l-3.87-3c-1.08.72-2.45 1.15-4.07 1.15-3.13 0-5.78-2.11-6.73-4.96H1.27v3.1A12 12 0 0 0 12 24z"/><path fill="#FBBC05" d="M5.27 14.27a7.2 7.2 0 0 1 0-4.54v-3.1H1.27a12 12 0 0 0 0 10.74z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.94 1.19 15.24 0 12 0 7.31 0 3.26 2.69 1.27 6.63l4 3.1C6.22 6.86 8.87 4.75 12 4.75z"/></svg>
    Continue with Google
  </button>

  <div class="divider">or</div>

  <form id="emailForm">
    <label for="email">Email</label>
    <input type="email" id="email" required autocomplete="email">
    <label for="password">Password</label>
    <input type="password" id="password" required autocomplete="new-password" minlength="6">
    <button type="submit" class="btn btn-primary" id="submitBtn">Create account</button>
  </form>

  <p class="toggle-mode" id="toggleMode">
    Already have an account? <a id="toggleLink">Log in</a>
  </p>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
  import {
    getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
    GoogleAuthProvider, signInWithPopup
  } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCvblBNhHTTmU24ueyXuMb5ClpP7o33vS0",
    authDomain: "doorfeast-7aad3.firebaseapp.com",
    projectId: "doorfeast-7aad3",
    storageBucket: "doorfeast-7aad3.firebasestorage.app",
    messagingSenderId: "35448390780",
    appId: "1:35448390780:web:5b922ebba1e9fb611f35f9"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const googleProvider = new GoogleAuthProvider();

  const errorBox = document.getElementById('errorBox');
  const emailForm = document.getElementById('emailForm');
  const submitBtn = document.getElementById('submitBtn');
  const googleBtn = document.getElementById('googleBtn');
  const toggleLink = document.getElementById('toggleLink');
  const toggleMode = document.getElementById('toggleMode');
  const formTitle = document.getElementById('formTitle');
  const formSub = document.getElementById('formSub');

  let mode = 'signup'; // or 'login'

  function showError(msg){
    errorBox.textContent = msg;
    errorBox.classList.add('show');
  }
  function clearError(){
    errorBox.classList.remove('show');
  }

  function friendlyError(err){
    const code = err.code || '';
    if(code.includes('email-already-in-use')) return "That email's already registered — try logging in instead.";
    if(code.includes('invalid-email')) return "That email address doesn't look right.";
    if(code.includes('weak-password')) return "Password should be at least 6 characters.";
    if(code.includes('user-not-found') || code.includes('wrong-password') || code.includes('invalid-credential')) return "Email or password is incorrect.";
    if(code.includes('popup-closed-by-user')) return "Google sign-in was closed before finishing.";
    return "Something went wrong — please try again.";
  }

  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz35vcPmEyHIZYGHucfufMBIaBvronJR1xWm5mTX-zo0QvAawANxJWn5NMwH5quHRwv/exec";

  function jsonpFetch(url){
    return new Promise((resolve, reject) => {
      const cbName = 'jsonp_cb_' + Date.now() + '_' + Math.floor(Math.random()*10000);
      window[cbName] = (data) => { resolve(data); delete window[cbName]; script.remove(); };
      const script = document.createElement('script');
      script.src = url + (url.includes('?') ? '&' : '?') + 'callback=' + cbName;
      script.onerror = () => reject(new Error('failed'));
      document.body.appendChild(script);
    });
  }

  // Always check application status by uid — works the same whether this was
  // a brand-new signup (no application found yet -> onboarding form) or an
  // existing login (found -> route by pending/approved/rejected status).
  async function goToOnboarding(user){
    try {
      const data = await jsonpFetch(`${APPS_SCRIPT_URL}?action=status&uid=${encodeURIComponent(user.uid)}`);
      if(data.found && (data.status || '').toLowerCase().indexOf('approved') === 0){
        // 👉 dashboard.html doesn't exist yet — this is a placeholder redirect.
        window.location.href = `dashboard.html?uid=${encodeURIComponent(user.uid)}`;
      } else if(data.found){
        window.location.href = `application-thankyou.html?uid=${encodeURIComponent(user.uid)}`;
      } else {
        const params = new URLSearchParams({ uid: user.uid, email: user.email || '' });
        window.location.href = `application.html?${params.toString()}`;
      }
    } catch(err){
      const params = new URLSearchParams({ uid: user.uid, email: user.email || '' });
      window.location.href = `application.html?${params.toString()}`;
    }
  }

  toggleLink.addEventListener('click', () => {
    clearError();
    if(mode === 'signup'){
      mode = 'login';
      formTitle.textContent = 'Welcome back';
      formSub.textContent = 'Log in to check your application status.';
      submitBtn.textContent = 'Log in';
      toggleMode.innerHTML = `New here? <a id="toggleLink">Create an account</a>`;
    } else {
      mode = 'signup';
      formTitle.textContent = 'Become a DoorFeast Partner';
      formSub.textContent = 'Create your account to start your takeaway application.';
      submitBtn.textContent = 'Create account';
      toggleMode.innerHTML = `Already have an account? <a id="toggleLink">Log in</a>`;
    }
    // re-bind since innerHTML was replaced
    document.getElementById('toggleLink').addEventListener('click', () => toggleLink.click());
  });

  emailForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    clearError();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    submitBtn.disabled = true;
    submitBtn.textContent = mode === 'signup' ? 'Creating account…' : 'Logging in…';

    try {
      let cred;
      if(mode === 'signup'){
        cred = await createUserWithEmailAndPassword(auth, email, password);
      } else {
        cred = await signInWithEmailAndPassword(auth, email, password);
      }
      goToOnboarding(cred.user);
    } catch(err){
      showError(friendlyError(err));
      submitBtn.disabled = false;
      submitBtn.textContent = mode === 'signup' ? 'Create account' : 'Log in';
    }
  });

  googleBtn.addEventListener('click', async () => {
    clearError();
    googleBtn.disabled = true;
    try {
      const cred = await signInWithPopup(auth, googleProvider);
      goToOnboarding(cred.user);
    } catch(err){
      showError(friendlyError(err));
    } finally {
      googleBtn.disabled = false;
    }
  });
</script>
</body>
</html>
