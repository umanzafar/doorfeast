<!DOCTYPE html>
<html lang="en" class="auth-pending">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DoorFeast — Customer Account</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  html.auth-pending body{visibility:hidden;}
  :root{
    --cream:#F7F3EC; --card:#FFFFFF; --ink:#1B1815; --body:#6E6A62;
    --red:#A61E1E; --red-dark:#7C1616; --line:#E4DFD2;
  }
  *{box-sizing:border-box;} html,body{margin:0;padding:0;}
  body{
    font-family:'Inter',sans-serif; background:var(--cream); color:var(--ink);
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:20px;
    padding:40px 34px; max-width:400px; width:100%;
  }
  .card img{width:40px; border-radius:10px; display:block; margin:0 auto 16px;}
  .card h1{font-family:'Poppins',sans-serif; font-size:21px; text-align:center; margin:0 0 6px;}
  .card p.sub{font-size:13.5px; color:var(--body); text-align:center; margin:0 0 26px;}

  label{font-size:12.5px; font-weight:600; color:var(--body); display:block; margin-bottom:6px;}
  input{
    width:100%; border:1.5px solid var(--line); border-radius:10px; padding:12px 14px;
    font-size:14px; margin-bottom:16px; font-family:inherit;
  }
  input:focus{outline:none; border-color:var(--red); box-shadow:0 0 0 4px rgba(166,30,30,0.12);}

  .btn{
    width:100%; border:none; border-radius:999px; padding:13px; font-weight:700; font-size:14.5px;
    cursor:pointer; margin-bottom:12px;
  }
  .btn-primary{background:var(--red); color:#fff;}
  .btn-primary:hover{background:var(--red-dark);}
  .btn-primary:disabled{opacity:0.6; cursor:not-allowed;}
  .btn-google{
    background:#fff; color:var(--ink); border:1.5px solid var(--line);
    display:flex; align-items:center; justify-content:center; gap:10px;
  }
  .btn-google:hover{border-color:#c9c3b3;}
  .btn-google:disabled{opacity:0.6; cursor:not-allowed;}

  .divider{display:flex; align-items:center; gap:12px; margin:18px 0; color:var(--body); font-size:12.5px;}
  .divider::before, .divider::after{content:""; flex:1; height:1px; background:var(--line);}

  .error-box{
    background:rgba(166,30,30,0.06); border:1px solid rgba(166,30,30,0.25); color:var(--red);
    font-size:12.5px; padding:10px 14px; border-radius:10px; margin-bottom:16px; display:none;
  }
  .error-box.show{display:block;}

  .toggle-mode{text-align:center; font-size:13px; color:var(--body); margin-top:6px;}
  .toggle-mode a{color:var(--red); font-weight:600; text-decoration:none; cursor:pointer;}
  .toggle-mode a:hover{text-decoration:underline;}
  .back-link{display:block; text-align:center; font-size:12.5px; color:var(--body); margin-top:18px; text-decoration:none;}
  .back-link:hover{color:var(--ink);}
</style>
</head>
<body>

<div class="card">
  <img src="../logo.png" alt="DoorFeast">
  <h1 id="formTitle">Create your account</h1>
  <p class="sub" id="formSub">Order faster, track your orders, and save your addresses.</p>

  <div class="error-box" id="errorBox"></div>

  <button class="btn btn-google" id="googleBtn">
    <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.52 12.27c0-.79-.07-1.54-.2-2.27H12v4.3h6.47a5.53 5.53 0 0 1-2.4 3.63v3h3.87c2.27-2.09 3.58-5.17 3.58-8.66z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.94-2.92l-3.87-3c-1.08.72-2.45 1.15-4.07 1.15-3.13 0-5.78-2.11-6.73-4.96H1.27v3.1A12 12 0 0 0 12 24z"/><path fill="#FBBC05" d="M5.27 14.27a7.2 7.2 0 0 1 0-4.54v-3.1H1.27a12 12 0 0 0 0 10.74z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.94 1.19 15.24 0 12 0 7.31 0 3.26 2.69 1.27 6.63l4 3.1C6.22 6.86 8.87 4.75 12 4.75z"/></svg>
    Continue with Google
  </button>

  <div class="divider">or</div>

  <form id="emailForm">
    <div id="nameField">
      <label for="name">Full name</label>
      <input type="text" id="name" autocomplete="name">
    </div>
    <label for="email">Email</label>
    <input type="email" id="email" required autocomplete="email">
    <label for="password">Password</label>
    <input type="password" id="password" required autocomplete="new-password" minlength="6">
    <button type="submit" class="btn btn-primary" id="submitBtn">Create account</button>
  </form>

  <p class="toggle-mode" id="toggleMode">
    Already have an account? <a id="toggleLink">Log in</a>
  </p>
  <a href="../index.html" class="back-link">← Back to DoorFeast</a>
</div>

<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

  const SUPABASE_URL = 'https://ooiajowrhwvidyydqhnl.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9vaWFqb3dyaHd2aWR5eWRxaG5sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwNTY0MDAsImV4cCI6MjEwMTYzMjQwMH0.gbPWyPYehj7_-xyJk3SgvkFpAUWLrI-FdFIYX39V_f4';
  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const errorBox = document.getElementById('errorBox');
  const emailForm = document.getElementById('emailForm');
  const submitBtn = document.getElementById('submitBtn');
  const googleBtn = document.getElementById('googleBtn');
  const toggleLink = document.getElementById('toggleLink');
  const toggleMode = document.getElementById('toggleMode');
  const formTitle = document.getElementById('formTitle');
  const formSub = document.getElementById('formSub');
  const nameField = document.getElementById('nameField');
  const nameInput = document.getElementById('name');

  // ?mode=login lets index.html's "Log in" nav link land here already
  // in login mode, while "Sign up as a customer" lands in signup mode.
  let mode = new URLSearchParams(window.location.search).get('mode') === 'login' ? 'login' : 'signup';
  applyMode();

  function applyMode(){
    if(mode === 'login'){
      formTitle.textContent = 'Welcome back';
      formSub.textContent = 'Log in to your DoorFeast account.';
      submitBtn.textContent = 'Log in';
      nameField.style.display = 'none';
      nameInput.required = false;
      toggleMode.innerHTML = `New here? <a id="toggleLink">Create an account</a>`;
    } else {
      formTitle.textContent = 'Create your account';
      formSub.textContent = 'Order faster, track your orders, and save your addresses.';
      submitBtn.textContent = 'Create account';
      nameField.style.display = 'block';
      nameInput.required = true;
      toggleMode.innerHTML = `Already have an account? <a id="toggleLink">Log in</a>`;
    }
    document.getElementById('toggleLink').addEventListener('click', () => {
      mode = mode === 'signup' ? 'login' : 'signup';
      clearError();
      applyMode();
    });
  }

  function showError(msg){
    errorBox.textContent = msg;
    errorBox.classList.add('show');
  }
  function clearError(){
    errorBox.classList.remove('show');
  }

  function friendlyError(err){
    const msg = (err && err.message || '').toLowerCase();
    const status = err && err.status;
    if(status === 429 || msg.includes('rate limit') || msg.includes('too many requests')) return "Too many attempts right now — please wait a few minutes and try again.";
    if(msg.includes('already registered')) return "That email's already registered — try logging in instead.";
    if(msg.includes('invalid login credentials')) return "Email or password is incorrect.";
    if(msg.includes('password should be at least')) return "Password should be at least 6 characters.";
    if(msg.includes('unable to validate email') || msg.includes('invalid email')) return "That email address doesn't look right.";
    return "Something went wrong — please try again.";
  }

  // Every logged-in customer must have a row in `customers` — create one
  // on first signup, and backfill it on login too (covers accounts that
  // signed in before this table existed, or via Google without ever
  // hitting the signup form).
  async function ensureCustomerRow(user, fallbackName){
    const { data: existing } = await supabase
      .from('customers')
      .select('id')
      .eq('user_id', user.id)
      .maybeSingle();
    if(existing) return;

    await supabase.from('customers').insert({
      user_id: user.id,
      name: fallbackName || user.user_metadata?.full_name || user.email.split('@')[0],
      email: user.email
    });
  }

  async function goToAccount(){
    window.location.href = 'account.html';
  }

  emailForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    clearError();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const name = nameInput.value.trim();

    submitBtn.disabled = true;
    submitBtn.textContent = mode === 'signup' ? 'Creating account…' : 'Logging in…';

    try {
      if(mode === 'signup'){
        const { data, error } = await supabase.auth.signUp({ email, password });
        if(error) throw error;
        if(data.user) await ensureCustomerRow(data.user, name);
      } else {
        const { data, error } = await supabase.auth.signInWithPassword({ email, password });
        if(error) throw error;
        if(data.user) await ensureCustomerRow(data.user);
      }
      await goToAccount();
    } catch(err){
      showError(friendlyError(err));
      submitBtn.disabled = false;
      submitBtn.textContent = mode === 'signup' ? 'Create account' : 'Log in';
    }
  });

  googleBtn.addEventListener('click', async () => {
    clearError();
    googleBtn.disabled = true;
    try {
      const { error } = await supabase.auth.signInWithOAuth({
        provider: 'google',
        options: { redirectTo: window.location.origin + window.location.pathname }
      });
      if(error) throw error;
    } catch(err){
      showError(friendlyError(err));
      googleBtn.disabled = false;
    }
  });

  // If we're already logged in (including landing back here after a
  // Google redirect), make sure a customers row exists, then go
  // straight to the account page instead of showing the form.
  const { data: { session } } = await supabase.auth.getSession();
  if(session){
    await ensureCustomerRow(session.user);
    await goToAccount();
  } else {
    document.documentElement.classList.remove('auth-pending');
  }
</script>
</body>
</html>
