<!DOCTYPE html>
<html lang="en" class="auth-pending">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Orders — DoorFeast</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  html.auth-pending body{visibility:hidden;}
  :root{
    --cream:#F7F3EC; --card:#FFFFFF; --ink:#1B1815; --body:#6E6A62;
    --red:#A61E1E; --line:#E4DFD2; --green:#2E7D46; --amber:#8A6414;
  }
  *{box-sizing:border-box;} html,body{margin:0;padding:0;}
  body{font-family:'Inter',sans-serif; background:var(--cream); color:var(--ink);}
  a{color:inherit;}

  header.nav{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 24px; background:var(--card); border-bottom:1px solid var(--line);
  }
  .nav-logo{display:flex; align-items:center; gap:8px; text-decoration:none;}
  .nav-logo img{width:30px; border-radius:8px;}
  .nav-logo span{font-family:'Poppins',sans-serif; font-weight:800; font-size:15px; color:var(--ink);}
  .nav-links{display:flex; gap:20px; align-items:center; font-size:13.5px; font-weight:600;}
  .nav-links a{text-decoration:none; color:var(--body);}
  .nav-links a.active{color:var(--red);}
  .nav-links a:hover{color:var(--red);}

  .wrap{max-width:640px; margin:0 auto; padding:36px 24px 60px;}
  h1{font-family:'Poppins',sans-serif; font-size:22px; margin:0 0 6px;}
  p.sub{font-size:13.5px; color:var(--body); margin:0 0 26px;}

  .empty-state{
    text-align:center; padding:60px 24px; color:var(--body); font-size:14px;
    background:var(--card); border:1px dashed var(--line); border-radius:16px;
  }
  .order-card{
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:18px 20px; margin-bottom:14px; display:flex; justify-content:space-between; gap:14px; flex-wrap:wrap;
  }
  .oc-left{min-width:180px;}
  .oc-number{font-family:'Poppins',sans-serif; font-weight:700; font-size:14.5px; margin-bottom:4px;}
  .oc-restaurant{font-size:13px; color:var(--body); margin-bottom:6px;}
  .oc-date{font-size:12px; color:var(--body);}
  .oc-right{text-align:right;}
  .oc-total{font-weight:700; font-size:15px; margin-bottom:6px;}
  .oc-status{
    display:inline-block; font-size:11.5px; font-weight:700; text-transform:capitalize;
    padding:4px 10px; border-radius:999px; background:rgba(217,164,65,0.15); color:var(--amber);
  }
  .oc-status.completed{background:rgba(46,125,70,0.12); color:var(--green);}
  .oc-status.rejected, .oc-status.refunded{background:rgba(166,30,30,0.1); color:var(--red);}
</style>
</head>
<body>

<header class="nav">
  <a href="../index.html" class="nav-logo"><img src="../logo.png" alt="DoorFeast"><span>DoorFeast</span></a>
  <div class="nav-links">
    <a href="account.html">My account</a>
    <a href="orders.html" class="active">My orders</a>
    <a href="#" id="logoutLink">Log out</a>
  </div>
</header>

<div class="wrap">
  <h1>My orders</h1>
  <p class="sub">Your past and current orders will show up here.</p>

  <div id="ordersWrap">
    <div style="text-align:center; padding:30px 0; color:var(--body); font-size:14px;">Loading your orders…</div>
  </div>
</div>

<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

  const SUPABASE_URL = 'https://ooiajowrhwvidyydqhnl.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9vaWFqb3dyaHd2aWR5eWRxaG5sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwNTY0MDAsImV4cCI6MjEwMTYzMjQwMH0.gbPWyPYehj7_-xyJk3SgvkFpAUWLrI-FdFIYX39V_f4';
  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  function escapeHtml(str){
    if(!str) return '';
    return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function formatGBP(pence){
    return '£' + (pence / 100).toLocaleString('en-GB', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function formatDate(iso){
    return new Date(iso).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
  }

  document.getElementById('logoutLink').addEventListener('click', async (e) => {
    e.preventDefault();
    await supabase.auth.signOut();
    window.location.href = 'index.html';
  });

  const ordersWrap = document.getElementById('ordersWrap');

  function renderOrders(orders){
    if(orders.length === 0){
      ordersWrap.innerHTML = `<div class="empty-state">No orders yet — orders will appear here once you place one.</div>`;
      return;
    }
    ordersWrap.innerHTML = orders.map(o => `
      <div class="order-card">
        <div class="oc-left">
          <div class="oc-number">${escapeHtml(o.order_number)}</div>
          <div class="oc-restaurant">${escapeHtml(o.restaurants ? o.restaurants.name : 'Restaurant')}</div>
          <div class="oc-date">${formatDate(o.created_at)}</div>
        </div>
        <div class="oc-right">
          <div class="oc-total">${formatGBP(o.total_pence)}</div>
          <span class="oc-status ${o.status}">${escapeHtml(o.status.replace('_', ' '))}</span>
        </div>
      </div>
    `).join('');
  }

  (async function init(){
    const { data: { session } } = await supabase.auth.getSession();
    if(!session){
      window.location.href = 'index.html';
      return;
    }

    const { data: customer, error: customerError } = await supabase
      .from('customers')
      .select('id')
      .eq('user_id', session.user.id)
      .maybeSingle();

    if(customerError || !customer){
      document.documentElement.classList.remove('auth-pending');
      ordersWrap.innerHTML = `<div class="empty-state">Couldn't load your account. Try logging out and back in.</div>`;
      return;
    }

    const { data: orders, error: ordersError } = await supabase
      .from('orders')
      .select('*, restaurants(name)')
      .eq('customer_id', customer.id)
      .order('created_at', { ascending: false });

    document.documentElement.classList.remove('auth-pending');

    if(ordersError){
      ordersWrap.innerHTML = `<div class="empty-state">Couldn't load your orders. Please try again.</div>`;
      return;
    }

    renderOrders(orders || []);
  })();
</script>
</body>
</html>
